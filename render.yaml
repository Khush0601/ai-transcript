services:
  - type: web
    name: ai-transcript
    runtime: python
    plan: free
    buildCommand: >-
      uv sync --project backend --locked --no-dev &&
      npm ci --prefix frontend &&
      npm run build --prefix frontend
    startCommand: >-
      cd backend &&
      uv run --no-sync alembic upgrade head &&
      uv run --no-sync fastapi run app/main.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: UV_VERSION
        value: 0.13.7
      - key: ENVIRONMENT
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.5-transcribe-live

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-speech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speech}
      POSTGRES_DB: ${POSTGRES_DB:-speech}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-speech} -d ${POSTGRES_DB:-speech}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
